{% extends "base/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">Réinitialisation du mot de passe</h2>
                    <p class="text-muted mb-4">
                        Entrez votre adresse email pour recevoir les instructions de réinitialisation.
                    </p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-primary" type="submit">
                                <i class="bi bi-envelope me-2"></i>Envoyer les instructions
                            </button>
                            <a href="{% url 'accounts:candidate_login' %}" class="btn btn-link text-decoration-none">
                                Retour à la connexion
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
