{% extends "base/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="card-title mb-4">
                        {% if form.instance.pk %}Modifier{% else %}Créer{% endif %} une offre d'emploi
                    </h2>
                    
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="{% if form.instance.pk %}{% url 'jobs:job_detail' form.instance.pk %}{% else %}{% url 'jobs:job_list' %}{% endif %}" 
                               class="btn btn-outline-secondary me-md-2">
                                Annuler
                            </a>
                            <button type="submit" class="btn btn-primary">
                                {% if form.instance.pk %}Mettre à jour{% else %}Publier{% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
