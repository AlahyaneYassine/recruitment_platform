{% extends "base/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Répondre à la candidature de {{ application.candidate.get_full_name }}</h2>
    <p>Pour le poste: <strong>{{ application.job.title }}</strong></p>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i> Envoyer
        </button>
        <a href="{% url 'applications:application_detail' pk=application.pk %}" class="btn btn-secondary">
            Annuler
        </a>
    </form>
</div>
{% endblock %}
