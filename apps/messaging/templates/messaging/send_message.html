{% extends "base/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Envoyer un message</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Envoyer</button>
        <a href="{% url 'messaging:inbox' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
